services:

  db:
    image: postgres:16
    container_name: task_management_db
    environment:
      POSTGRES_DB: myDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: task_management_api
    env_file:
      - .env
    environment:
      DB_CONNECTION: postgresql://postgres:admin@db:5432/myDb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: