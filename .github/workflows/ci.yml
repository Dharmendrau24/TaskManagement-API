name: FastAPI CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: myDb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myDb_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip show httpx2

      - name: Run tests
        env:
          DB_CONNECTION: postgresql://postgres:admin@localhost:5432/myDb_test
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
        run: pytest -v